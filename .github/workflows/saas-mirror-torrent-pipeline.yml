name: SaaS Mirror Torrent Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  MIRROR_LINKS: |
    DockerHub Python 3.10 Slim|https://hub.docker.com/_/python
    DockerHub Python 3.11 Slim|https://hub.docker.com/_/python
    GHCR DevContainer Python 3.10|https://github.com/devcontainers/images/pkgs/container/python
    GHCR DevContainer Python 3.11|https://github.com/devcontainers/images/pkgs/container/python
  TEST_BUNDLE_NAME: arcitek-quantum-saas-distribution

jobs:
  website-and-pipeline:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mirror and torrent pipeline tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl aria2 transmission-cli
          rm -rf /var/lib/apt/lists/*

      - name: Validate mirror download links are active
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import sys

          entries = [x for x in os.environ["MIRROR_LINKS"].splitlines() if x.strip()]
          failures = []
          for entry in entries:
              name, url = entry.split("|", 1)
              req = urllib.request.Request(url, method="HEAD")
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      code = resp.getcode()
                      if code >= 400:
                          failures.append(f"{name}: {url} returned {code}")
                      else:
                          print(f"OK {name}: {url} ({code})")
              except Exception as exc:
                  failures.append(f"{name}: {url} ({exc})")

          if failures:
              print("Mirror link validation failed:")
              for f in failures:
                  print(f)
              sys.exit(1)
          PY

      - name: Build SaaS website artifact with mirrored links
        run: |
          mkdir -p dist
          python - <<'PY'
          import os

          entries = [x for x in os.environ["MIRROR_LINKS"].splitlines() if x.strip()]
          items = []
          for entry in entries:
              name, url = entry.split("|", 1)
              items.append(f"<li><a href='{url}' target='_blank' rel='noopener noreferrer'>{name}</a></li>")

          html = f"""<!doctype html>
          <html lang='en'>
            <head>
              <meta charset='utf-8' />
              <meta name='viewport' content='width=device-width,initial-scale=1' />
              <title>ArciTEK.AI SaaS Mirror Downloads</title>
            </head>
            <body>
              <h1>ArciTEK.AI SaaS Mirror Downloads</h1>
              <p>Automated mirror list generated by CI.</p>
              <ul>
                {''.join(items)}
              </ul>
            </body>
          </html>
          """

          with open("dist/index.html", "w", encoding="utf-8") as f:
              f.write(html)
          PY

      - name: Create distribution bundle
        run: |
          tar -czf "${TEST_BUNDLE_NAME}.tar.gz" dist/

      - name: Generate torrent metadata for high-speed distribution
        run: |
          transmission-create -o "${TEST_BUNDLE_NAME}.torrent" \
            -t "udp://tracker.opentrackr.org:1337/announce" \
            "${TEST_BUNDLE_NAME}.tar.gz"

      - name: Test torrent metadata readability in container pipeline
        run: |
          transmission-show "${TEST_BUNDLE_NAME}.torrent"

      - name: Simulate high-speed segmented download pipeline
        run: |
          aria2c --split=16 --max-connection-per-server=16 --min-split-size=1M \
            --allow-overwrite=true --out "${TEST_BUNDLE_NAME}.downloaded.tar.gz" \
            "file://${GITHUB_WORKSPACE}/${TEST_BUNDLE_NAME}.tar.gz"

      - name: Upload SaaS website and torrent artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saas-mirror-torrent-artifacts
          path: |
            dist/index.html
            ${{ env.TEST_BUNDLE_NAME }}.tar.gz
            ${{ env.TEST_BUNDLE_NAME }}.torrent
