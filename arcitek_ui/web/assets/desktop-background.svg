<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" preserveAspectRatio="xMidYMid slice" role="img" aria-label="ArciTEK AI infinite2025 — powered by Watsonx, Q-CTRL and IBM Quantum">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#101724"/>
      <stop offset="55%" stop-color="#070a10"/>
      <stop offset="100%" stop-color="#030407"/>
    </radialGradient>
    <linearGradient id="loop-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f3fd8"/>
      <stop offset="45%" stop-color="#2a56e8"/>
      <stop offset="100%" stop-color="#123097"/>
    </linearGradient>
    <linearGradient id="loop-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb52e"/>
      <stop offset="50%" stop-color="#f08a12"/>
      <stop offset="100%" stop-color="#c96a08"/>
    </linearGradient>
    <linearGradient id="crossover" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a56e8"/>
      <stop offset="50%" stop-color="#ffb52e"/>
      <stop offset="100%" stop-color="#f08a12"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f5f7"/>
      <stop offset="55%" stop-color="#c9ccd2"/>
      <stop offset="100%" stop-color="#8d9199"/>
    </linearGradient>
    <linearGradient id="ai-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8442c"/>
      <stop offset="100%" stop-color="#a32014"/>
    </linearGradient>
    <linearGradient id="infinite-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2f6bf0"/>
      <stop offset="100%" stop-color="#1d47c0"/>
    </linearGradient>
    <radialGradient id="halo-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a56e8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#2a56e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9b1d" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#ff9b1d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Backdrop -->
  <rect width="1024" height="1024" fill="url(#bg-glow)"/>

  <!-- Faint blueprint grid lines -->
  <g stroke="#2a56e8" stroke-opacity=".1" stroke-width="1">
    <path d="M96 268h250M96 268v210" fill="none"/>
    <path d="M560 160v250M560 160h230" fill="none"/>
    <path d="M120 430l160-140" fill="none"/>
    <circle cx="330" cy="410" r="230" fill="none" stroke-opacity=".07"/>
    <circle cx="672" cy="425" r="205" fill="none" stroke-opacity=".07"/>
  </g>

  <!-- Glows behind the infinity loops -->
  <circle cx="320" cy="400" r="300" fill="url(#halo-blue)"/>
  <circle cx="690" cy="420" r="280" fill="url(#halo-gold)"/>

  <!-- Particle field -->
  <g fill="#3b63ff" opacity=".8">
    <circle cx="150" cy="300" r="2"/><circle cx="185" cy="255" r="1.6"/><circle cx="230" cy="215" r="2.2"/>
    <circle cx="280" cy="190" r="1.5"/><circle cx="205" cy="330" r="1.4"/><circle cx="250" cy="280" r="1.8"/>
    <circle cx="320" cy="205" r="1.4"/><circle cx="170" cy="380" r="1.7"/><circle cx="135" cy="345" r="1.3"/>
    <circle cx="300" cy="250" r="1.2"/><circle cx="365" cy="185" r="1.8"/><circle cx="410" cy="215" r="1.3"/>
  </g>
  <g fill="#ffc14d" opacity=".85">
    <circle cx="470" cy="240" r="1.8"/><circle cx="520" cy="210" r="1.4"/><circle cx="575" cy="235" r="2"/>
    <circle cx="615" cy="205" r="1.5"/><circle cx="655" cy="240" r="1.6"/><circle cx="545" cy="555" r="1.7"/>
    <circle cx="600" cy="590" r="1.4"/><circle cx="500" cy="520" r="1.5"/><circle cx="445" cy="300" r="1.3"/>
    <circle cx="835" cy="330" r="1.6"/><circle cx="865" cy="415" r="1.4"/><circle cx="810" cy="540" r="1.7"/>
  </g>

  <!-- Infinity symbol -->
  <g stroke-linecap="round" fill="none">
    <!-- soft under-glow stroke -->
    <path d="M512 415C455 320 380 268 315 268 218 268 158 340 158 415s60 147 157 147c65 0 140-52 197-147 57-95 132-147 197-147 97 0 157 72 157 147s-60 147-157 147c-65 0-140-52-197-147z"
          stroke="#0d1c4e" stroke-width="112" opacity=".8" filter="url(#soft)"/>
    <!-- left loop: deep blue -->
    <path d="M512 415C455 320 380 268 315 268 218 268 158 340 158 415s60 147 157 147c65 0 140-52 197-147"
          stroke="url(#loop-blue)" stroke-width="88"/>
    <!-- right loop: molten gold -->
    <path d="M512 415c57-95 132-147 197-147 97 0 157 72 157 147s-60 147-157 147c-65 0-140-52-197-147"
          stroke="url(#loop-gold)" stroke-width="88"/>
    <!-- crossover ribbon blending both -->
    <path d="M420 480c30-15 62-38 92-65 30-27 60-52 92-65" stroke="url(#crossover)" stroke-width="88" opacity=".9"/>
    <!-- inner rim highlights -->
    <path d="M512 415C455 320 380 268 315 268 218 268 158 340 158 415s60 147 157 147c65 0 140-52 197-147"
          stroke="#f7b733" stroke-width="6" stroke-opacity=".85" stroke-dasharray="2 14"/>
    <path d="M512 415c57-95 132-147 197-147 97 0 157 72 157 147s-60 147-157 147c-65 0-140-52-197-147"
          stroke="#123097" stroke-width="6" stroke-opacity=".9"/>
    <path d="M512 415c57-95 132-147 197-147 97 0 157 72 157 147s-60 147-157 147c-65 0-140-52-197-147"
          stroke="#ffd27a" stroke-width="3" stroke-opacity=".8" transform="translate(0,-46)"/>
  </g>

  <!-- Golden spiral detail inside left loop -->
  <g stroke="#f7a91b" fill="none" stroke-opacity=".9">
    <path d="M315 415a8 8 0 0 1 8-8 16 16 0 0 1 16 16 26 26 0 0 1-26 26 38 38 0 0 1-38-38 52 52 0 0 1 52-52 68 68 0 0 1 68 68" stroke-width="3.5"/>
    <circle cx="315" cy="415" r="58" stroke-width="1.4" stroke-dasharray="3 6"/>
    <circle cx="315" cy="415" r="76" stroke-width="1.2" stroke-dasharray="2 8"/>
  </g>

  <!-- Circuit rings inside right loop -->
  <g stroke="#1d47c0" fill="none" stroke-opacity=".85">
    <circle cx="709" cy="415" r="62" stroke-width="3"/>
    <circle cx="709" cy="415" r="82" stroke-width="1.6" stroke-dasharray="10 7"/>
    <path d="M676 380l66 70M709 353v124M676 450l66-70" stroke-width="2.4" stroke-opacity=".6"/>
  </g>

  <!-- Wordmark -->
  <g text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="710" y="728" text-anchor="end" font-size="118" font-weight="700" letter-spacing="2" fill="url(#wordmark)">ArciTEK</text>
    <text x="734" y="728" text-anchor="start" font-size="118" font-weight="800" letter-spacing="4" fill="url(#ai-red)">AI</text>
    <text x="356" y="818" font-size="64" font-weight="600" letter-spacing="2" fill="url(#infinite-blue)">infinite2025</text>
    <text x="264" y="890" font-size="34" font-weight="500" fill="#b9b2a4" opacity=".92">powered by</text>
    <text x="472" y="890" font-size="42" font-weight="700" fill="#ded8ca">Watsonx</text>
    <text x="712" y="890" font-size="42" font-weight="600" letter-spacing="1" fill="#ded8ca">Q–CTRL</text>
    <text x="415" y="952" font-size="34" font-weight="700" letter-spacing="1" fill="#e8e2d4">IBM</text>
    <text x="524" y="952" font-size="34" font-weight="400" fill="#d4cec0">Quantum</text>
  </g>

  <!-- Separator marks between Watsonx and Q-CTRL -->
  <g fill="#8f887a">
    <rect x="586" y="864" width="4" height="18" rx="2"/>
    <rect x="594" y="858" width="4" height="24" rx="2"/>
    <rect x="602" y="864" width="4" height="18" rx="2"/>
  </g>
</svg>
